services:
  devcontainer:
    image: ubuntu

  database:
    image: postgres:18.0
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/docker
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:8.10-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_ARGS: "--requirepass redis_dev_pwd --appendonly yes"

volumes:
  data:
  redis-data:
    driver: local