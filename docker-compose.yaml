services:
  app:
    image: ghcr.io/m-t-e-k-u-g-r/tresor_app
    build:
      dockerfile: Dockerfile
      context: .
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:8080"

  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  database:
    image: postgres:18.0
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DATABASE}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - data:/var/lib/postgresql/docker

volumes:
  data:
  redis-data:
    driver: local