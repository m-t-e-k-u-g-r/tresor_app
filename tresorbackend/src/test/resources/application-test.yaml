spring:
  datasource:
    url: jdbc:postgresql://database:5432/testdb
    username: test_user
    password: test_password
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    create-schemas: true

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
