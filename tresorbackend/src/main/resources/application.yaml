spring:
  application:
    name: tresorbackend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DATABASE}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
encryption:
  master-key: ${ENCRYPTION_KEY}
CROSS_ORIGIN: http://172.27.0.3:3000
