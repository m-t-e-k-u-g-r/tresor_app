spring:
  application:
    name: tresorbackend
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: 6379
      username: ${REDIS_USER}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DATABASE}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  session:
    store-type: redis
  sql:
    init:
      mode: never
encryption:
  master-key: ${ENCRYPTION_KEY}
  pepper: ${PEPPER}
